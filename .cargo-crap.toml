# cargo-crap 0.4.3. Threshold 30; fail-above is passed by coverage-crap.sh.
# allow = current production functions with CRAP > 30 (2026-09-16 snapshot).
# Remove a name when that function scores ≤ 30. Names are unique in this set.
# Bench and *_tests.rs / tests.rs / testutil.rs are excluded from the walk.
threshold = 30.0
exclude = [
  "**/crates/rbitcoin-bench/**",
  "**/*_tests.rs",
  "**/tests.rs",
  "**/testutil.rs",
  "**/tests/**",
]
