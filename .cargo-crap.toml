# cargo-crap 0.4.3. Threshold 30; fail-above is passed by coverage-crap.sh.
# allow = current production functions with CRAP > 30 (2026-09-16 snapshot).
# Remove a name when that function scores ≤ 30. Names are unique in this set.
# Bench and *_tests.rs / tests.rs / testutil.rs are excluded from the walk.
threshold = 30.0
exclude = [
  "**/crates/rbitcoin-bench/**",
  "**/*_tests.rs",
  "**/tests.rs",
  "**/testutil.rs",
  "**/tests/**",
  "**/core_vectors.rs",
]
allow = [
  "ChainHub::accept_branch_inner",
  "ChainHub::reconsider_block_inner",
  "NodeConfig::apply_kv",
  "Query::join_spends_wave",
  "Query::resume_work_path_after_tip_excluding",
  "ScriptHashTable::apply_head_upserts",
  "ScriptHashTable::unlink_create",
  "SegmentedTxHead::probe_candidates_batch_wave",
  "Store::check_confirmed_height",
  "Store::open_layout",
  "StrongTxTable::count_ones_bits",
  "StrongTxTable::set_bits_range",
  "TxTable::open_inwit",
  "TxTable::put_spend_batch_by_abs_meta",
  "UringSession::submit_and_wait_one",
  "apply_peer_event",
  "assemble_block_prevouts",
  "assemble_run",
  "cli_main",
  "decode_cmd_payload",
  "dispatch_inner",
  "dispatch_pinned",
  "drive_script_waves_with",
  "eval_script",
  "handle_peer_frame",
  "ibd_cancellable",
  "method_help",
  "need_any_valid_body_download",
  "on_block",
  "on_blocktxn",
