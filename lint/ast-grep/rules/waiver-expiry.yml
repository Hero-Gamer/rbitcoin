id: mutant-waiver-missing-date
language: rust
severity: error
message: "MUTANT-WAIVER: add expiry — e.g. expires 2027-01-15"
note: "See TESTING.md — all waivers need review date"
rule:
  kind: line_comment
  regex: "MUTANT-WAIVER"
  not:
    regex: "expires\\s+\\b20\\d{2}-\\d{2}-\\d{2}\\b"
ignores:
  - "**/*tests*.rs"
  - "**/tests/**"
