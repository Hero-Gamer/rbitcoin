# Two-tank Warnet lab image. Label `warnet` or workflow_dispatch.
# Not a required check. Not kind/Helm miner_std.
name: warnet-example

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: warnet-example-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warnet-example:
    name: warnet-example
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'warnet')
    env:
      CARGO_TARGET_DIR: target/dev
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          enable_kvm: false
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: warnet-example-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: warnet-example-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: warnet-example
          workspaces: ". -> target/dev"
      - name: Build node and lab image example
        run: |
          set -euo pipefail
          nix develop --command cargo build -p rbitcoin-node
          ./scripts/core-functional/init-submodule.sh
          ./scripts/core-functional/warnet/Dockerfile.test.sh
          chmod +x ./scripts/core-functional/warnet/example.sh
          ./scripts/core-functional/warnet/example.sh
