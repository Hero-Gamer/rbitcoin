# Core functional gate: nightly + dispatch + ship PRs + labels.
# Unlabeled non-ship PRs do not start the heavy job. Default cargo test
# never calls nightly.sh.
#
# `release-extra` always reports on pull_request. It fails when the tree
# is a ship version (patch != 99) and `core-functional` was not success.
# Ask the operator to make `release-extra` a required check on master /
# v*.*.x. See docs/releases.md.
name: core-functional

on:
  schedule:
    # Off the hour so we do not pile onto the public Actions stampede.
    - cron: "27 6 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: core-functional-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: detect-ship
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.v.outputs.ship }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - name: Classify ship vs .99
        id: v
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "ship=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kind="$(./scripts/release-gate.sh --kind)"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [[ "$kind" == ship ]]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"
          fi

  core-functional:
    name: core-functional
    needs: [detect]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      (github.event_name != 'pull_request' ||
       needs.detect.outputs.ship == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'core-functional') ||
       contains(github.event.pull_request.labels.*.name, 'release'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nightly (inventory + Core-release warn + run set)
        run: ./scripts/core-functional/nightly.sh

  release-extra:
    name: release-extra
    needs: [detect, core-functional]
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    steps:
      - name: detect-ship must succeed
        run: |
          set -euo pipefail
          [[ "${{ needs.detect.result }}" == "success" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ship PRs require core-functional
        env:
          DETECT_SHIP: ${{ needs.detect.outputs.ship }}
          CF_RESULT: ${{ needs.core-functional.result }}
        run: ./scripts/release-gate.sh --ci-extra
