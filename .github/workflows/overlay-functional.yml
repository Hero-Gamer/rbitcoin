# Overlay functional gate: nightly + dispatch + ship PRs + labels.
# Unlabeled non-ship PRs do not start the heavy job. Default cargo test
# never calls run.sh.
name: overlay-functional

on:
  schedule:
    - cron: "42 6 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: overlay-functional-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: detect-ship
    runs-on: ubuntu-latest
    outputs:
      ship: ${{ steps.v.outputs.ship }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
      - name: Classify ship vs .99
        id: v
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "ship=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          kind="$(./scripts/release-gate.sh --kind)"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [[ "$kind" == ship ]]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"
          fi

  overlay-functional:
    name: overlay-functional
    needs: [detect]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      always() &&
      needs.detect.result == 'success' &&
      (github.event_name != 'pull_request' ||
       needs.detect.outputs.ship == 'true' ||
       contains(github.event.pull_request.labels.*.name, 'overlay-functional') ||
       contains(github.event.pull_request.labels.*.name, 'release'))
    env:
      CARGO_TARGET_DIR: target/dev
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          enable_kvm: false
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: overlay-functional-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: overlay-functional-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: overlay-functional
          workspaces: ". -> target/dev"
      - name: TUN
        run: sudo modprobe tun
      - name: overlay journeys
        run: nix develop .#overlayFunctional --command ./scripts/overlay-functional/run.sh
