name: mutants

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/rbitcoin-primitives/**"
      - ".github/workflows/mutants.yml"

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutants-weekly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # rustc 1.95.0
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-mutants@27.1.0
      - run: cargo mutants -p rbitcoin-primitives -j 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-weekly-out
          path: mutants.out/
          if-no-files-found: ignore

  mutants-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # rustc 1.95.0
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-mutants@27.1.0
      - run: |
          git diff origin/${{ github.base_ref }}.. --unified=0 > git.diff
          echo "diff lines: $(wc -l < git.diff)"
          git diff --stat origin/${{ github.base_ref }}.. || true
          cargo mutants -p rbitcoin-primitives --in-diff git.diff -j 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutants-diff-out
          path: mutants.out/
          if-no-files-found: ignore
